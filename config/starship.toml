"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ † ](bg:#343d46 fg:#ffffff)$directory$custom$nodejs$fill$time
$character"""

[directory]
style = "bg:#5a9bcf fg:#0f1c23"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[custom.git_clean]
command = "git branch --show-current"
when = "git diff --quiet && git diff --cached --quiet && test -z \"$(git ls-files --others --exclude-standard)\""
style = "bg:#99c794 fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#99c794)[ $output ]($style)[\uE0B0](fg:#99c794)"

[custom.git_dirty]
command = "git branch --show-current"
when = "! git diff --quiet || ! git diff --cached --quiet || test -n \"$(git ls-files --others --exclude-standard)\""
style = "bg:#fac863 fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#fac863)[ $output ]($style)[\uE0B0](fg:#fac863)"

[custom.git_ahead]
command = "git branch --show-current"
when = "git status --porcelain=v1 --branch | grep -q '^## .*ahead'"
style = "bg:#c594c5 fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#c594c5)[ $output ]($style)[\uE0B0](fg:#c594c5)"

[custom.git_behind]
command = "git branch --show-current"
when = "git status --porcelain=v1 --branch | grep -q '^## .*behind'"
style = "bg:#ed6f7d fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#ed6f7d)[ $output ]($style)[\uE0B0](fg:#ed6f7d)"

[nodejs]
symbol = " "
style = "fg:#99c794"
format = "[ $symbol$version]($style)"
detect_files = ["package.json", ".nvmrc", ".node-version"]

[fill]
symbol = " "

[time]
disabled = false
style = "fg:#65737e"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](fg:#5fb3b3)"
error_symbol = "[❯](fg:#ed6f7d)"
