"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ † ](bg:#343d46 fg:#ffffff)$directory${custom.git_ahead}${custom.git_behind}${custom.git_dirty}${custom.git_clean}$nodejs$fill$time
$character"""

[directory]
style = "bg:#5a9bcf fg:#0f1c23"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[custom.git_clean]
command = "git branch --show-current"
when = '[ -z "$(git status --porcelain 2>/dev/null)" ] && ! git rev-list @{u}..HEAD 2>/dev/null | grep -q . && ! git rev-list HEAD..@{u} 2>/dev/null | grep -q .'
use_stdin = false
style = "bg:#99c794 fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#99c794)[ $output ]($style)[\uE0B0](fg:#99c794)"
shell = ["bash", "--noprofile", "--norc", "-c"]

[custom.git_dirty]
command = "git branch --show-current"
when = '[ -n "$(git status --porcelain 2>/dev/null)" ]'
use_stdin = false
style = "bg:#fac863 fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#fac863)[ $output ]($style)[\uE0B0](fg:#fac863)"
shell = ["bash", "--noprofile", "--norc", "-c"]

[custom.git_ahead]
command = "git branch --show-current"
when = '[ -z "$(git status --porcelain 2>/dev/null)" ] && git rev-list @{u}..HEAD 2>/dev/null | grep -q .'
use_stdin = false
style = "bg:#c594c5 fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#c594c5)[ $output ]($style)[\uE0B0](fg:#c594c5)"
shell = ["bash", "--noprofile", "--norc", "-c"]

[custom.git_behind]
command = "git branch --show-current"
when = '[ -z "$(git status --porcelain 2>/dev/null)" ] && git rev-list HEAD..@{u} 2>/dev/null | grep -q .'
use_stdin = false
style = "bg:#ed6f7d fg:#0f1c23"
format = "[\uE0B0](fg:#5a9bcf bg:#ed6f7d)[ $output ]($style)[\uE0B0](fg:#ed6f7d)"
shell = ["bash", "--noprofile", "--norc", "-c"]

[nodejs]
symbol = " "
style = "fg:#99c794"
format = "[ $symbol$version]($style)"
detect_files = ["package.json", ".nvmrc", ".node-version"]

[fill]
symbol = " "

[time]
disabled = false
style = "fg:#65737e"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](fg:#5fb3b3)"
error_symbol = "[❯](fg:#ed6f7d)"
